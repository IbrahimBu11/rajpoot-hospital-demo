function shell(){const nav=menus[state.role];return `<div class="app"><aside class="sidebar"><div class="brand"><div class="logo">${icon('heart')}</div><div><strong>rajpoothospital<span style="color:var(--primary)">.</span></strong><small>Healthcare, made simple</small></div></div><div class="aside-title">WORKSPACE</div><div class="nav-list">${nav.map(([page,label,ico])=>`<button class="nav ${state.page===page?'active':''}" data-nav="${page}">${icon(ico)}<span>${E(label)}</span>${page==='patients'?`<span class="nav-count">${data.patients.length}</span>`:''}</button>`).join('')}</div><div class="side-bottom"><label class="rolelabel">PREVIEW AS</label><select class="role-picker" id="role-switch">${Object.entries(roleNames).map(([k,v])=>`<option value="${k}" ${state.role===k?'selected':''}>${E(v)}</option>`).join('')}</select><p class="preview-note">Demo mode — switch roles to explore. No real login or clinical data.</p><button data-action="reset" class="btn ghost small" style="margin:8px 3px">${icon('refresh')} Reset demo data</button></div></aside><div class="main"><header class="topbar"><div class="breadcrumbs">Hospital workspace <span style="padding:0 8px">/</span> <b>${E(labelForPage())}</b></div><div class="top-right"><span class="top-pill">● Demo environment</span><div class="identity"><div class="avatar">${E(initials(actor[state.role]))}</div><div><strong>${E(actor[state.role])}</strong><small>${E(roleNames[state.role])}</small></div></div><div class="mobile-bar"><select id="mobile-role" class="role-picker">${Object.entries(roleNames).map(([k,v])=>`<option value="${k}" ${state.role===k?'selected':''}>${E(v)}</option>`).join('')}</select></div></div></header><main class="content">${pageHTML()}</main></div></div>${state.modal?modalHTML():''}${state.toast?`<div class="toast">${icon('check')} ${E(state.toast)}</div>`:''}`}
function labelForPage(){if(state.page==='profile')return 'Patient profile';if(state.page==='new-consultation')return 'New consultation';const x=menus[state.role].find(a=>a[0]===state.page);return x?.[1]||'Overview'}
function intro(title,subtitle,action=''){return `<div class="page-intro"><div><div class="eyebrow">RAJPOOT HOSPITAL / ${E(roleNames[state.role])}</div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div>${action}</div>`}
function metric(label,val,ico,sub){return `<div class="stat"><div class="stat-top"><span>${label}</span><div class="stat-icon">${icon(ico)}</div></div><div class="stat-value">${E(val)}</div><div class="stat-sub">${sub}</div></div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
const tr=(cols,action='')=>`<tr ${action?`class="clickable" data-action="${action}"`:''}>${cols.map(c=>`<td>${c}</td>`).join('')}</tr>`;
function overview(){if(state.role==='admin'){return intro('Good morning, Admin 👋','Here is a quick overview of your hospital today.',btn(`${icon('plus')} Register patient`,'new-patient',''))+`<div class="stats">${metric('Total patients',data.patients.length,'users','Across all records')}${metric('Doctors',data.staff.filter(x=>x.role==='doctor').length,'stethoscope','Active demo accounts')}${metric('Appointments',data.appointments.length,'calendar','Scheduled in demo')}${metric('Consultations',data.consultations.length,'clipboard','Recorded visits')}</div><div class="cols"><div class="card"><div class="card-header"><div><h3>Recent patients</h3><p>Quick access to patient profiles</p></div>${btn('View all','goto-patients','ghost small')}</div>${table(['Patient','City','Age','Action'],data.patients.slice(0,5).map(p=>tr([person(p),E(p.city),E(p.age)+' yrs',`<span style="color:var(--primary);font-weight:800">View profile →</span>`],`profile:${p.id}`)))}</div><div class="card"><div class="card-header"><h3>Quick actions</h3></div><div class="card-inner"><div class="mini-step"><div class="num">01</div><div style="flex:1"><strong>Register a patient</strong><small>Create a permanent patient record</small></div>${btn(icon('plus'),'new-patient','secondary small')}</div><div class="mini-step"><div class="num">02</div><div style="flex:1"><strong>Book an appointment</strong><small>Assign a patient to a doctor</small></div>${btn(icon('calendar'),'new-appointment','secondary small')}</div><div class="mini-step"><div class="num">03</div><div style="flex:1"><strong>Invite a staff member</strong><small>Create a role-based account</small></div>${btn(icon('plus'),'new-staff','secondary small')}</div></div></div></div>`}
if(state.role==='doctor'){const latest=data.consultations.filter(c=>c.doctor==='Dr. Sara Malik');return intro('Your clinical workspace','All the essentials for quick, confident consultations.',btn(`${icon('plus')} New consultation`,'new-consultation',''))+`<div class="stats">${metric('All patients',data.patients.length,'users','Available in directory')}${metric('My consultations',latest.length,'stethoscope','Recorded consultations')}${metric('Appointments',data.appointments.filter(a=>a.doctor==='Dr. Sara Malik').length,'calendar','Scheduled')}${metric('Prescriptions',latest.reduce((v,c)=>v+(c.meds?.length||0),0),'pill','Medication items')}</div><div class="cols"><div class="card"><div class="card-header"><div><h3>My appointments</h3><p>Select a patient to open their chart</p></div></div>${table(['Patient','Date & time','Status'],data.appointments.filter(a=>a.doctor==='Dr. Sara Malik').map(a=>tr([person(byId(a.patientId)),fmt(a.date)+' · '+E(a.time),tag(a.status,'green')],`profile:${a.patientId}`)))}</div><div class="card"><div class="card-header"><h3>Fast consultation</h3></div><div class="cardpad"><div class="notice">${icon('stethoscope')} Open a patient, review their history, then document diagnosis and medication in one place.</div><div style="margin-top:20px">${btn('Start a consultation →','new-consultation','')}</div></div></div></div>`}
if(state.role==='pharmacist')return intro('Pharmacy workspace','Review prescriptions and patient medication history.',btn('View all prescriptions','goto-prescriptions',''))+`<div class="stats">${metric('Patients',data.patients.length,'users','Registered patients')}${metric('Prescription items',data.consultations.reduce((n,c)=>n+c.meds.length,0),'pill','Issued items')}${metric('Dispensed',data.dispensed.length,'check','Demo items')}${metric('Awaiting review',Math.max(0,data.consultations.reduce((n,c)=>n+c.meds.length,0)-data.dispensed.length),'clock','Not dispensed')}</div>${prescriptionsTable(true)}`;
return intro('Laboratory workspace','Attach, review and release laboratory results.',btn(`${icon('plus')} Add lab report`,'new-lab',''))+`<div class="stats">${metric('Total patients',data.patients.length,'users','Directory')}${metric('Lab reports',data.labs.length,'flask','In system')}${metric('Pending',data.labs.filter(l=>l.status==='Pending').length,'clock','Awaiting results')}${metric('Released',data.labs.filter(l=>l.status==='Released').length,'check','Available in history')}</div>${labTable()}`}
function patientsPage(){const q=state.search.toLowerCase();const matches=data.patients.filter(p=>[p.name,p.id,p.phone,p.city].join(' ').toLowerCase().includes(q));const action=state.role==='admin'?btn(`${icon('plus')} New patient`,'new-patient',''):'';return intro('Patients','Your searchable, shared patient directory.',action)+`<div class="toolbar"><div class="toolbar-left"><div class="searchbox">${icon('search')}<input id="patient-search" placeholder="Search name, phone, or patient ID" value="${E(state.search)}" aria-label="Search patients"></div>${tag(`${matches.length} patients`)}</div></div><div class="card">${matches.length?table(['Patient','Age / Gender','Phone','City',''],matches.map(p=>tr([person(p),`${E(p.age)} yrs · ${E(p.gender)}`,E(p.phone),E(p.city),`<span style="color:var(--primary);font-weight:800">Open ${icon('chevron')}</span>`],`profile:${p.id}`))):`<div class="empty">${icon('search')}<strong>No patients found</strong><p>Try searching by full name, phone number or patient ID.</p></div>`}</div>`}
function profilePage(){const p=byId(state.patientId);if(!p){state.page='patients';return patientsPage()}const cs=data.consultations.filter(c=>c.patientId===p.id).slice().reverse(),ls=data.labs.filter(l=>l.patientId===p.id).slice().reverse();const pharma=state.role==='pharmacist';const lab=state.role==='lab';const admin=state.role==='admin';const dr=state.role==='doctor';const buttons=[admin?btn(`${icon('edit')} Edit profile`,'edit-patient','secondary'):null,(admin||dr)?btn(`${icon('plus')} New consultation`,'new-consultation',''):null,(lab||admin)?btn(`${icon('plus')} Add lab report`,'new-lab',''):null].filter(Boolean).join(' ');const tabs=pharma?['medications']:lab?['timeline','reports']:['timeline','consultations','medications','reports'];if(!tabs.includes(state.tab))state.tab=tabs[0];const meds=cs.flatMap(c=>c.meds.map(m=>({...m,doctor:c.doctor,date:c.date,consultId:c.id})));let content='';if(state.tab==='timeline'){const ev=[...cs.map(c=>({date:c.date,icon:'stethoscope',title:pharma?'Prescription':'Doctor consultation',body:pharma?'Medication order recorded':`<b>Diagnosis:</b> ${E(c.diagnosis)}<br><span class="sub">${E(c.doctor)} · ${E(c.symptoms||'No symptoms entered')}</span>`})),...ls.map(l=>({date:l.date,icon:'flask',title:`${E(l.test)} · Lab report`,body:`${tag(l.status,l.status==='Released'?'green':'amber')} <span class="sub">${l.status==='Released'?E(l.result):'Result not released'}</span>`}))].sort((a,b)=>b.date.localeCompare(a.date));content=ev.length?`<div class="history">${ev.map(x=>`<div class="event"><div class="event-icon">${icon(x.icon)}</div><div class="event-body"><div class="event-head"><strong>${x.title}</strong><span class="event-date">${fmt(x.date)}</span></div><p>${x.body}</p></div></div>`).join('')}</div>`:emptyRecord()}
if(state.tab==='consultations')content=cs.length?`<div class="history">${cs.map(c=>`<div class="event"><div class="event-icon">${icon('stethoscope')}</div><div class="event-body"><div class="event-head"><strong>${E(c.diagnosis)}</strong><span class="event-date">${fmt(c.date)}</span></div><p>${E(c.symptoms||'No symptoms recorded')}</p><p><b>Doctor:</b> ${E(c.doctor)}<br><b>Notes:</b> ${E(c.notes||'None')}</p></div></div>`).join('')}</div>`:emptyRecord();
if(state.tab==='medications')content=meds.length?table(['Medicine','Instructions','Prescribed','Status'],meds.map(m=>tr([`<strong style="color:var(--text)">${E(m.name)}</strong>`,`${E(m.dose)} · ${E(m.frequency)}<br><small>${E(m.duration)}</small>`,fmt(m.date),tag(data.dispensed.includes(`${m.consultId}:${m.name}`)?'Dispensed':'Prescribed',data.dispensed.includes(`${m.consultId}:${m.name}`)?'green':'blue')]))) :emptyRecord('No prescriptions yet');
if(state.tab==='reports')content=ls.length?table(['Test','Date','Result','Status'],ls.map(l=>tr([`<b>${E(l.test)}</b>`,fmt(l.date),E(l.status==='Released'?l.result:'Not released'),tag(l.status,l.status==='Released'?'green':'amber')]))) :emptyRecord('No laboratory reports yet');
return `<button class="back" data-action="goto-patients">${icon('left')} Back to patients</button><div class="profile-top"><div class="profile-header"><div class="profile-big">${E(initials(p.name))}</div><div><div class="profile-name">${E(p.name)}</div><div class="profile-meta">${E(p.id)} &nbsp;·&nbsp; ${E(p.age)} years &nbsp;·&nbsp; ${E(p.gender)}</div></div></div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px">${buttons}</div></div><div class="cols"><div class="card"><div class="card-header"><div><h3>Medical history</h3><p>${pharma?'Medication information for pharmacy review':lab?'Relevant longitudinal history':'Every visit in one continuous record'}</p></div>${tag(`${cs.length} visits`)}</div><div class="tabs">${tabs.map(t=>`<button data-tab="${t}" class="tab ${state.tab===t?'active':''}">${{timeline:'Timeline',consultations:'Consultations',medications:'Prescriptions',reports:'Lab reports'}[t]}</button>`).join('')}</div>${content}</div><div><div class="card"><div class="card-header"><h3>Patient information</h3></div><div class="cardpad"><div class="detail-grid"><div class="detail"><small>Patient ID</small><b>${E(p.id)}</b></div><div class="detail"><small>Age</small><b>${E(p.age)} years</b></div><div class="detail"><small>Phone</small><b>${E(p.phone||'—')}</b></div><div class="detail"><small>Location</small><b>${E(p.city||'—')}</b></div></div>${!pharma||pharma?`<div class="notice warning" style="margin-top:16px">${icon('shield')} <span><b>Recorded allergies</b><br>${E(p.allergies||'Not recorded')}</span></div>`:''}</div></div><div class="card" style="margin-top:16px"><div class="card-header"><h3>At a glance</h3></div><div class="cardpad"><div class="mini-step"><div class="num">${cs.length}</div><div><strong>Consultations</strong><small>Clinical encounters</small></div></div><div class="mini-step"><div class="num">${meds.length}</div><div><strong>Medicines</strong><small>Issued prescription items</small></div></div><div class="mini-step"><div class="num">${ls.length}</div><div><strong>Lab reports</strong><small>Attached to patient</small></div></div></div></div></div></div>`}
function emptyRecord(t='No records yet'){return `<div class="empty">${icon('clipboard')}<strong>${t}</strong><p>New patient history will appear here as the hospital team adds records.</p></div>`}
function appointmentsPage(){return intro('Appointments','Manage upcoming consultations and doctor schedules.',btn(`${icon('plus')} Book appointment`,'new-appointment',''))+`<div class="card">${table(['Patient','Doctor','Date','Time','Status'],data.appointments.map(a=>tr([person(byId(a.patientId)),E(a.doctor),fmt(a.date),E(a.time),tag(a.status,'blue')],`profile:${a.patientId}`)))}</div>`}
function staffPage(){return intro('Staff accounts','Manage your team and their access to the hospital.',btn(`${icon('plus')} Add staff member`,'new-staff',''))+`<div class="card">${table(['Team member','Login email','Role','Status'],data.staff.map(s=>tr([`<div class="person"><div class="person-avatar">${E(initials(s.name))}</div><div><strong>${E(s.name)}</strong></div></div>`,E(s.email),tag(roleNames[s.role]||s.role),tag('Active','green')])))}</div><div class="notice" style="margin-top:20px">${icon('shield')} Demo accounts are illustrative only. A production system must verify identities, store passwords securely and enforce permissions on every API request.</div>`}
function consultationsPage(){return intro('Consultations','Review patient consultations and start new clinical encounters.',btn(`${icon('plus')} New consultation`,'new-consultation',''))+`<div class="card">${table(['Patient','Diagnosis','Doctor','Date'],data.consultations.slice().reverse().map(c=>tr([person(byId(c.patientId)),E(c.diagnosis),E(c.doctor),fmt(c.date)],`profile:${c.patientId}`)))}</div>`}
function prescriptionsTable(standalone=false){const entries=data.consultations.flatMap(c=>c.meds.map(m=>({...m,patientId:c.patientId,doctor:c.doctor,date:c.date,consultId:c.id}))).reverse();return `<div class="card"><div class="card-header"><div><h3>${standalone?'Recent prescriptions':'All prescriptions'}</h3><p>Medication orders across patients</p></div>${standalone?'':tag(`${entries.length} items`)}</div>${entries.length?table(['Patient','Medication','Instructions','Status','Action'],entries.map(m=>{const key=`${m.consultId}:${m.name}`,done=data.dispensed.includes(key);return tr([person(byId(m.patientId)),`<strong>${E(m.name)}</strong><br><small>${E(m.doctor)}</small>`,`${E(m.dose)} · ${E(m.frequency)}<br><small>${E(m.duration)}</small>`,tag(done?'Dispensed':'Prescribed',done?'green':'blue'),done?tag('Complete','green'):`<button class="btn small" data-action="dispense:${encodeURIComponent(key)}">Mark dispensed</button>`])})) :emptyRecord('No prescriptions to review')}</div>`}
function prescriptionsPage(){return intro('Prescriptions','Read doctor-issued orders and track dispensing.')+prescriptionsTable()}
function labTable(){return `<div class="card"><div class="card-header"><div><h3>Laboratory records</h3><p>Test results and their review status</p></div></div>${data.labs.length?table(['Patient','Test','Result','Date','Status'],data.labs.slice().reverse().map(l=>tr([person(byId(l.patientId)),E(l.test),E(l.result),fmt(l.date),tag(l.status,l.status==='Released'?'green':'amber')],`profile:${l.patientId}`))):emptyRecord()}</div>`}
function labPage(){return intro('Lab reports','Manage test records linked to patient profiles.',btn(`${icon('plus')} Add lab report`,'new-lab',''))+labTable()}
function pageHTML(){switch(state.page){case 'overview':return overview();case 'patients':return patientsPage();case 'profile':return profilePage();case 'appointments':return appointmentsPage();case 'staff':return staffPage();case 'consultations':return consultationsPage();case 'prescriptions':return prescriptionsPage();case 'laboratory':return labPage();default:state.page='overview';return overview()}}
function field(label,name,placeholder='',type='text',value='',extra=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" placeholder="${E(placeholder)}" value="${E(value)}" ${extra}></div>`}
function selectField(label,name,options,val=''){return `<div class="field"><label for="f-${name}">${label}</label><select name="${name}" id="f-${name}">${options.map(o=>`<option value="${E(o.value)}" ${o.value===val?'selected':''}>${E(o.label)}</option>`).join('')}</select></div>`}
function textareaField(label,name,placeholder='',value=''){return `<div class="field"><label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}" placeholder="${E(placeholder)}" rows="3">${E(value)}</textarea></div>`}
function patientField(){return selectField('Patient *','patientId',data.patients.map(p=>({value:p.id,label:`${p.name} · ${p.id}`})),state.patientId||data.patients[0]?.id)}
function medsHTML(){return Array.from({length:state.formMedCount},(_,i)=>`<div class="med-row">${field(`Medicine ${i+1}`,'med_name_'+i,'Medicine name')}${field('Dose','med_dose_'+i,'e.g. 1 tablet')}${field('Frequency / duration','med_freq_'+i,'e.g. Daily, 7 days')}<button type="button" class="iconbtn" data-action="remove-med:${i}" title="Remove medicine">${icon('trash')}</button></div>`).join('')}
function modalHTML(){const m=state.modal;let title='',body='',footer='';if(m==='new-patient'||m==='edit-patient'){const p=m==='edit-patient'?byId(state.patientId):null;title=p?'Edit patient profile':'Register new patient';body=`<form id="modal-form" data-kind="${m}"><div class="form-grid">${field('Full name *','name','e.g. Ayesha Khan','text',p?.name||'','required')}${field('Phone number','phone','03XX-XXXXXXX','tel',p?.phone||'')}${field('Age *','age','Years','number',p?.age||'','min="0" max="120" required')}${selectField('Gender','gender',['Female','Male','Other','Prefer not to say'].map(x=>({value:x,label:x})),p?.gender||'Female')}${field('City','city','Lahore','text',p?.city||'')}${field('Allergies / alerts','allergies','If known','text',p?.allergies||'')}</div><div class="form-footer">${btn('Cancel','close','secondary') }<button class="btn" type="submit">${p?'Save changes':'Create patient profile'}</button></div></form>`}
if(m==='new-staff'){title='Create staff account';body=`<form id="modal-form" data-kind="new-staff"><div class="form-grid">${field('Full name *','name','Staff member name','text','','required')}${field('Email *','email','name@hospital.pk','email','','required')}${selectField('Role *','role',[{value:'doctor',label:'Doctor'},{value:'pharmacist',label:'Pharmacist'},{value:'lab',label:'Lab Operator'},{value:'staff',label:'Other Staff'}])}</div><div class="notice" style="margin-top:19px">${icon('shield')} This demo adds a staff record, not a functioning login. Real accounts require invitations, verified identities and server-side permissions.</div><div class="form-footer">${btn('Cancel','close','secondary')}<button type="submit" class="btn">Create demo account</button></div></form>`}
if(m==='new-appointment'){title='Book appointment';body=`<form id="modal-form" data-kind="new-appointment"><div class="form-grid">${patientField()}${selectField('Doctor *','doctor',data.staff.filter(s=>s.role==='doctor').map(s=>({value:s.name,label:s.name})))}${field('Date *','date','','date',today(),'required')}${field('Time *','time','','time','10:00','required')}</div><div class="form-footer">${btn('Cancel','close','secondary')}<button class="btn" type="submit">Book appointment</button></div></form>`}
if(m==='new-consultation'){title='New doctor consultation';body=`<form id="modal-form" data-kind="new-consultation"><div class="form-section" style="padding:0 0 21px"><h3><span class="form-step">1</span> Patient & consultation</h3><div class="form-grid">${patientField()}${field('Visit date','date','','date',today(),'required')}${textareaField('Symptoms / chief complaint','symptoms','Describe the patient’s concern...')}${field('Diagnosis *','diagnosis','Enter diagnosis','text','','required')}${textareaField('Clinical notes','notes','Assessment, advice or follow-up...')}</div></div><div class="form-section" style="padding:22px 0"><h3><span class="form-step">2</span> Prescription <span class="muted" style="font-size:11px;font-weight:500">(optional)</span></h3><div id="med-rows">${medsHTML()}</div><button type="button" class="btn secondary small" data-action="add-med">${icon('plus')} Add medicine</button></div><div class="form-footer">${btn('Cancel','close','secondary')}<button class="btn" type="submit">Save consultation</button></div></form>`}
if(m==='new-lab'){title='Add laboratory report';body=`<form id="modal-form" data-kind="new-lab"><div class="form-grid">${patientField()}${field('Test name *','test','e.g. Complete Blood Count','text','','required')}${field('Report date','date','','date',today(),'required')}${selectField('Report status','status',[{value:'Pending',label:'Pending — preliminary'},{value:'Released',label:'Released — final (demo only)'}])}<div class="field span2">${textareaField('Report result / observations *','result','Enter findings or values...')}</div></div><div class="notice warning" style="margin-top:17px">${icon('shield')} In production, preliminary lab results should only be released after verification by an authorized reviewer.</div><div class="form-footer">${btn('Cancel','close','secondary')}<button class="btn" type="submit">Save lab report</button></div></form>`}
return `<div class="modal-backdrop" data-action="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${E(title)}"><div class="modal-head"><h2>${E(title)}</h2><button type="button" class="close" data-action="close" aria-label="Close">${icon('x')}</button></div><div class="modal-body">${body}</div></div></div>`}
function toast(s){state.toast=s;render();setTimeout(()=>{state.toast='';const n=document.querySelector('.toast');if(n)n.remove()},3600)}
function render(){document.getElementById('app').innerHTML=shell();const s=document.getElementById('patient-search');if(s){s.addEventListener('input',e=>{state.search=e.target.value;const start=e.target.selectionStart;render();const r=document.getElementById('patient-search');r?.focus();r?.setSelectionRange(start,start)})}}
function act(a){if(a==='close'||a==='backdrop'){state.modal=null;render();return}if(a==='reset'){if(confirm('Reset all fictional demo records?')){data=initial();save();state.page='overview';state.patientId=null;toast('Demo data restored')}return}if(a.startsWith('profile:')){state.patientId=a.slice(8);state.page='profile';state.tab='timeline';render();return}if(a.startsWith('dispense:')){if(state.role!=='pharmacist')return;const k=decodeURIComponent(a.slice(9));if(!data.dispensed.includes(k))data.dispensed.push(k);save();toast('Dispensing status updated');return}if(a==='goto-patients'){state.page='patients';state.search='';render();return}if(a==='goto-prescriptions'){state.page='prescriptions';render();return}if(a==='new-consultation'&&state.role!=='admin'&&state.role!=='doctor')return;if(a==='new-lab'&&state.role!=='admin'&&state.role!=='lab')return;if(['new-patient','edit-patient','new-staff','new-appointment'].includes(a)&&state.role!=='admin')return;if(a==='add-med'){state.formMedCount++;const r=document.getElementById('med-rows');const i=state.formMedCount-1;r.insertAdjacentHTML('beforeend',`<div class="med-row">${field(`Medicine ${i+1}`,'med_name_'+i,'Medicine name')}${field('Dose','med_dose_'+i,'e.g. 1 tablet')}${field('Frequency / duration','med_freq_'+i,'e.g. Daily, 7 days')}<button type="button" class="iconbtn" data-action="remove-med:${i}" title="Remove medicine">${icon('trash')}</button></div>`);return}if(a.startsWith('remove-med:')){const node=document.querySelector(`[name="med_name_${a.split(':')[1]}"]`)?.closest('.med-row');if(node)node.remove();return}if(a==='new-consultation')state.formMedCount=1;state.modal=a;render()}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;render();return}const nav=e.target.closest('[data-nav]');if(nav){state.page=nav.dataset.nav;state.patientId=null;state.search='';render();return}const target=e.target.closest('[data-action]');if(target){if(target.dataset.action==='backdrop'&&e.target!==target)return;e.preventDefault();act(target.dataset.action)}});
document.addEventListener('change',e=>{if(e.target.id==='role-switch'||e.target.id==='mobile-role'){state.role=e.target.value;state.page='overview';state.patientId=null;state.search='';state.modal=null;render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='modal-form')return;e.preventDefault();const form=e.target,kind=form.dataset.kind;const fd=new FormData(form),v=k=>String(fd.get(k)||'').trim();if(kind==='new-patient'){if(!v('name')||!v('age'))return;const id='RH-'+String(Math.max(...data.patients.map(p=>Number(p.id.replace(/\D/g,''))),124)+1).padStart(6,'0');data.patients.push({id,name:v('name'),age:Number(v('age')),phone:v('phone'),gender:v('gender'),city:v('city'),allergies:v('allergies'),created:today()});state.patientId=id;state.page='profile'}else if(kind==='edit-patient'){const p=byId(state.patientId);if(!p)return;Object.assign(p,{name:v('name'),age:Number(v('age')),phone:v('phone'),gender:v('gender'),city:v('city'),allergies:v('allergies')})}else if(kind==='new-staff'){if(!v('name')||!v('email'))return;data.staff.push({id:'S'+Date.now(),name:v('name'),email:v('email'),role:v('role')})}else if(kind==='new-appointment'){data.appointments.push({id:'AP-'+Date.now(),patientId:v('patientId'),doctor:v('doctor'),date:v('date'),time:v('time'),status:'Scheduled'})}else if(kind==='new-consultation'){if(!v('diagnosis'))return;const meds=[];for(let i=0;i<state.formMedCount;i++){if(v('med_name_'+i))meds.push({name:v('med_name_'+i),dose:v('med_dose_'+i),frequency:v('med_freq_'+i),duration:''})}data.consultations.push({id:'C'+Date.now(),patientId:v('patientId'),doctor:actor[state.role],date:v('date'),symptoms:v('symptoms'),diagnosis:v('diagnosis'),notes:v('notes'),meds});state.patientId=v('patientId');state.page='profile';state.tab='timeline'}else if(kind==='new-lab'){if(!v('test')||!v('result'))return;data.labs.push({id:'LAB-'+Date.now(),patientId:v('patientId'),test:v('test'),result:v('result'),date:v('date'),status:v('status'),operator:actor[state.role]});state.patientId=v('patientId');state.page='profile';state.tab='reports'}save();state.modal=null;toast(({ 'new-patient':'Patient profile created','edit-patient':'Patient updated','new-staff':'Demo staff account created','new-appointment':'Appointment booked','new-consultation':'Consultation saved to history','new-lab':'Lab report saved'})[kind]||'Saved')});
render();
</script></body></html>
